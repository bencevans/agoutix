[project]
name = "agoutix"
version = "1.2.2"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ben Evans", email = "Benjamin.Evans@ioz.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "furl>=2.1.4",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "tqdm>=4.67.1",
]

[project.scripts]
agoutix = "agoutix:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "pandas>=3.0.3",
    "pytest>=9.0.2",
]
